services:
  postgres:
    image: postgres:16-alpine
    container_name: task-sync-db
    environment:
      POSTGRES_USER: tasksync
      POSTGRES_PASSWORD: tasksync
      POSTGRES_DB: tasksync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasksync"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
